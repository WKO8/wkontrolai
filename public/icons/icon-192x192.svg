<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Circuit Nodes / AI grid hint -->
  <circle cx="48" cy="48" r="3" fill="#34d399" opacity="0.4" />
  <circle cx="144" cy="48" r="3" fill="#38bdf8" opacity="0.4" />
  <line x1="48" y1="48" x2="68" y2="48" stroke="#34d399" stroke-width="1.5" opacity="0.3" />
  <line x1="124" y1="48" x2="144" y2="48" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- The "W" Monogram with AI nodes -->
  <path d="M42 66 L62 134 L96 86 L130 134 L150 66" fill="none" stroke="url(#wGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- AI Sparks/Nodes -->
  <circle cx="96" cy="86" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="62" cy="134" r="5" fill="#34d399" />
  <circle cx="130" cy="134" r="5" fill="#34d399" />

  <!-- Chat / Sparkle indicator -->
  <path d="M136 122 Q144 116 150 124 Q156 116 164 122 Q158 130 164 138 Q156 134 150 142 Q144 134 136 138 Q142 130 136 122 Z" fill="url(#aiGrad)" opacity="0.9" />
</svg>
